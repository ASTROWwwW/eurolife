<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fivem</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="box">
        <div class="avatar-container">
            <img id="avatar" src="./images/LouLou.png" alt="Avatar">
        </div>
        <div id="avatar-controls" class="hidden">
            <input type="text" id="avatar-url-input" placeholder="New URL">
            <button id="submit-avatar-url">Update Avatar</button>
        </div>
        <div class="title">
            BOUTIQUE
        </div>
        <div class="Id-Boutique">
            ID :
            <div id="id"></div>
        </div>
        <div class="Pts-Boutique">
            PTS :
            <div id="pts"></div>
        </div>
        <div class="inner-box" id="armes-box">
            <div class="inner-box-title">
                ARMES
            </div>
        </div>
        <div id="modal-box" class="modal hidden">
            <div class="modal-content">
                <span id="close-modal" class="close-button">&times;</span>
            </div>
        </div>
        <div id="confirm-box" class="confirm-modal hidden">
            <div class="confirm-modal-content">
                <p id="confirm-text"></p>
                <div class="confirm-buttons">
                    <button id="confirm-yes">Oui</button>
                    <button id="confirm-no">Non</button>
                </div>
            </div>
        </div>
        <div class="inner-box2">
            <div class="inner-box-title2">
                LOOT BOX
            </div>
        </div>
        <div id="lootbox-modal" class="lootbox-modal hidden">
            <div class="lootbox-modal-content">
                <span id="close-lootbox-modal" class="close-button">&times;</span>
            </div>
        </div> 
        <div id="lootbox-barre" class="lootbox-barre">
            <div id="lootbox-content" class="lootbox-content">
            </div>
        </div>       
        <div class="inner-box3">
            <div class="inner-box-title3">
                Historique
            </div>
        </div>
        <div id="historique-modal" class="historique-modal hidden">
            <div class="historique-modal-content">
                <span id="close-historique-modal" class="close-button">&times;</span>
            </div>
        </div>        
        <div class="inner-box4">
            <div class="inner-box-title4">
                CARS
            </div>
        </div>
        <div id="cars-modal" class="modal hidden">
            <div class="modal-content">
                <span id="close-cars-modal" class="close-button">&times;</span>
            </div>
        </div>
        <div id="confirm-box-cars" class="confirm-modal hidden">
            <div class="confirm-modal-content">
                <p id="confirm-text-cars"></p>
                <div class="confirm-buttons">
                    <button id="confirm-buy-cars">Acheter</button>
                    <button id="confirm-test-cars">Tester le Véhicule</button>
                    <button id="confirm-cancel-cars">Annuler</button>
                </div>
            </div>
        </div>        
        <div class="music-control">
            <input type="range" id="volume-control" min="0" max="100" value="50">
            <div class="buttons">
                <button id="music-toggle" class="round-button"><i class="fas fa-pause"></i></button>
                <button id="music-reload" class="round-button"><i class="fas fa-redo"></i></button>
            </div>
        </div>
        
        <button class="tebex" id="tebex-button">
            <span class="hover-underline-animation">Tebex</span>
        </button>
        <button class="site" id="site-button">
            <span class="hover-underline-animation">Website</span>
        </button>
        <button class="discord" id="discord-button">
            <span class="hover-underline-animation">Discord</span>
        </button>

        <div id="player"></div>

    </div>

    <script>
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;

    function onYouTubeIframeAPIReady() {
        console.log("YouTube API Ready");
    }

    function onPlayerReady(event) {
        player.setVolume(50);
        player.playVideo();
    }

    window.addEventListener('load', () => {
        const container = document.querySelector('.box');
        const idBoutique = document.querySelector('.Id-Boutique');
        const ptsBoutique = document.querySelector('.Pts-Boutique');
        const musicControl = document.querySelector('.music-control');
        const musicButton = document.getElementById('music-toggle');
        const reloadButton = document.getElementById('music-reload');
        const volumeControl = document.getElementById('volume-control');
        const icon = musicButton.querySelector('i');
        const armesBox = document.getElementById('armes-box');
        const modal = document.getElementById('modal-box');
        const closeModal = document.getElementById('close-modal');
        const historiqueBox = document.querySelector('.inner-box3');
        const modalHistorique = document.getElementById('historique-modal');
        const closeHistoriqueModal = document.getElementById('close-historique-modal');
        const lootboxModal = document.getElementById('lootbox-modal');
        const lootboxContent = document.querySelector('.lootbox-modal-content');
        const confirmBox = document.getElementById('confirm-box');
        const confirmText = document.getElementById('confirm-text');
        const lootboxBarre = document.getElementById('lootbox-barre');
        const lootboxInnerContent = document.getElementById('lootbox-content');
        const carsBox = document.querySelector('.inner-box4');
        const carsModal = document.getElementById('cars-modal');
        const closeCarsModal = document.getElementById('close-cars-modal');
        const confirmBoxCars = document.getElementById('confirm-box-cars');

        function toggleModal(modal, state) {
            if (state === 'show') {
                modal.style.display = 'flex';
            } else {
                modal.style.display = 'none';
            }
        }

        window.addEventListener('click', (event) => {
            if (event.target === lootboxModal) {
                toggleModal(lootboxModal, 'hide');
            }
        });

        container.style.visibility = 'hidden';
        idBoutique.style.visibility = 'hidden';
        ptsBoutique.style.visibility = 'hidden';
        musicControl.style.visibility = 'hidden';

        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                if (lootboxModal.style.display === 'flex') {
                    toggleModal(lootboxModal, 'hide');
                }
                if (modalHistorique.style.display === 'flex') {
                    toggleModal(modalHistorique, 'hide');
                }
                if (modal.style.display === 'flex') {
                    toggleModal(modal, 'hide');
                }
                if (confirmBox.style.display === 'block') {
                    confirmBox.style.display = 'none';
                }
                if (confirmBoxCars.style.display === 'block') {
                    confirmBoxCars.style.display = 'none';
                }
                if (carsModal.style.display === 'flex') {
                    toggleModal(carsModal, 'hide');
                }
                fetch(`https://${GetParentResourceName()}/closeall`);
            }
        });

        const avatarContainer = document.querySelector('.avatar-container');
        const avatarControls = document.getElementById('avatar-controls');

        avatarContainer.addEventListener('click', () => {
            avatarControls.classList.toggle('hidden');
        });

        document.getElementById('submit-avatar-url').addEventListener('click', () => {
            const newAvatarUrl = document.getElementById('avatar-url-input').value;
            const avatarImg = document.getElementById('avatar');
            avatarImg.src = newAvatarUrl;
            avatarControls.classList.add('hidden');

            const userId = document.getElementById('id').textContent;

            fetch(`https://${GetParentResourceName()}/updateAvatar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: userId, avatar: newAvatarUrl })
            });
        });

        window.addEventListener('message', function(event) {
            if (event.data && event.data.action === 'updateData') {
                const data = event.data.users[0];

                if (data) {
                    document.getElementById('id').textContent = data.idboutique;
                    document.getElementById('pts').textContent = data.ptsboutique;

                    if (data.avatar) {
                        const avatarUrl = data.avatar;
                        const avatarImg = document.getElementById('avatar');
                        avatarImg.src = avatarUrl;
                    }
                }
            }
        });

        musicButton.addEventListener('click', () => {
            if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.pauseVideo();
                icon.classList.remove('fa-pause');
                icon.classList.add('fa-play');
            } else {
                player.playVideo();
                icon.classList.remove('fa-play');
                icon.classList.add('fa-pause');
            }
        });

        reloadButton.addEventListener('click', () => {
            player.seekTo(0);
            player.playVideo();
            icon.classList.remove('fa-play');
            icon.classList.add('fa-pause');
        });

        volumeControl.addEventListener('input', () => {
            player.setVolume(volumeControl.value);
        });

        armesBox.addEventListener('click', () => {
            fetch(`https://${GetParentResourceName()}/armesClicked`); 
        });

        historiqueBox.addEventListener('click', () => {
            fetch(`https://${GetParentResourceName()}/historiqueClicked`);
        });

        carsBox.addEventListener('click', () => {
            fetch(`https://${GetParentResourceName()}/carsClicked`); 
        });


        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });

        carsBox.addEventListener('click', () => {
            toggleModal(carsModal, 'show');
        });

        closeCarsModal.addEventListener('click', () => {
            toggleModal(carsModal, 'hide');
        });

        window.addEventListener('click', (event) => {
            if (event.target === carsModal) {
                toggleModal(carsModal, 'hide');
            }
        });

        window.addEventListener('message', function(event) {
            if (event.data.action === 'updateCars') {
                const cars = event.data.cars;
                const modalContent = document.querySelector('#cars-modal .modal-content');
                modalContent.innerHTML = '<span id="close-cars-modal" class="close-button">&times;</span>';

                cars.forEach(car => {
                    const carBox = document.createElement('div');
                    carBox.classList.add('car-box');

                    const carImage = document.createElement('img');
                    carImage.src = `./images/${car.image}.png`;
                    carImage.alt = car.label;

                    const carLabel = document.createElement('h3');
                    carLabel.textContent = `${car.label} - ${car.price} PTS`;

                    carBox.appendChild(carImage);
                    carBox.appendChild(carLabel);
                    modalContent.appendChild(carBox);

                    carBox.addEventListener('click', function() {
                        proposerAchatCar(car);
                    });
                });

                document.getElementById('close-cars-modal').addEventListener('click', () => {
                    carsModal.style.display = 'none';
                });

                carsModal.style.display = 'flex';
            }
        });
        

        function proposerAchatCar(car) {
            document.getElementById('confirm-text-cars').textContent = `Voulez-vous acheter, voir ou tester ${car.label} pour ${car.price} PTS ?`;
            document.getElementById('confirm-box-cars').style.display = 'block';

            document.getElementById('confirm-buy-cars').onclick = function() {
                document.getElementById('confirm-box-cars').style.display = 'none';

                fetch(`https://${GetParentResourceName()}/acheterCarClient`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        carName: car.name,
                        carLabel: car.label,
                        prix: car.price,
                    })
                });
            };

            document.getElementById('confirm-test-cars').onclick = function() {
                document.getElementById('confirm-box-cars').style.display = 'none';

                fetch(`https://${GetParentResourceName()}/testerCarClient`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        carName: car.name
                    })
                });
            };

            document.getElementById('confirm-cancel-cars').onclick = function() {
                document.getElementById('confirm-box-cars').style.display = 'none';
            };
        }


        window.addEventListener('message', function(event) {
            if (event.data.action === 'updateArmes') {
                const armes = event.data.armes;
                const modalContent = document.querySelector('.modal-content');
                modalContent.innerHTML = '<span id="close-modal" class="close-button">&times;</span>';

                armes.forEach(arme => {
                    const armeBox = document.createElement('div');
                    armeBox.classList.add('arme-box');

                    const armeImage = document.createElement('img');
                    armeImage.src = `./images/${arme.image}.png`;
                    armeImage.alt = arme.label;

                    const armeLabel = document.createElement('h3');
                    armeLabel.textContent = `${arme.label} - ${arme.price} PTS`;

                    armeBox.appendChild(armeImage);
                    armeBox.appendChild(armeLabel);
                    modalContent.appendChild(armeBox);

                    armeBox.addEventListener('click', function() {
                        proposerAchat(arme);
                    });

                });

                document.getElementById('close-modal').addEventListener('click', () => {
                    modal.style.display = 'none';
                });

                modal.style.display = 'flex';
            }
        });

        function proposerAchat(arme) {
            document.getElementById('confirm-text').textContent = `Voulez-vous acheter ${arme.label} pour ${arme.price} PTS ?`;
            document.getElementById('confirm-box').style.display = 'block';

            document.getElementById('confirm-yes').onclick = function() {
                document.getElementById('confirm-box').style.display = 'none';

                fetch(`https://${GetParentResourceName()}/acheterArmeClient`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        armeName: arme.name,
                        armeLabel: arme.label,
                        prix: arme.price,
                        type: arme.type,
                        label: arme.label
                    })
                });
            };

            document.getElementById('confirm-no').onclick = function() {
                document.getElementById('confirm-box').style.display = 'none';
            };
        }

        document.getElementById('tebex-button').addEventListener('click', () => {
            const tebexUrl = window.currentConfig?.TebexUrl; 
            if (window.currentConfig?.ActiverTebexUrl && tebexUrl) {
                window.invokeNative('openUrl', tebexUrl);
            }
        });

        document.getElementById('site-button').addEventListener('click', () => {
            const websiteUrl = window.currentConfig?.WebsiteUrl; 
            if (window.currentConfig?.ActiverWebSiteUrl && websiteUrl) {
                window.invokeNative('openUrl', websiteUrl);
            }
        });

        document.getElementById('discord-button').addEventListener('click', () => {
            const discordUrl = window.currentConfig?.DiscordUrl;
            if (window.currentConfig?.ActiverDiscordUrl && discordUrl) {
                window.invokeNative('openUrl', discordUrl);
            }
        });

        window.addEventListener('message', (event) => {
            let data = event.data;

            if (data.action === 'open') {
                const config = event.data.config;
                window.currentConfig = config;
                const tebexUrl = config.TebexUrl;
                const websiteUrl = config.WebsiteUrl;
                const discordUrl = config.DiscordUrl;
                const activerTebex = config.ActiverTebexUrl;
                const activerWebsite = config.ActiverWebSiteUrl;
                const activerDiscord = config.ActiverDiscordUrl;
                const activerMusique = config.ActiverMusique; 
                const videoId = config.VideoId;

                if (activerMusique && videoId) {
                    if (!player) { 
                        player = new YT.Player('player', {
                            height: '0',
                            width: '0',
                            videoId: videoId, 
                            playerVars: {
                                'autoplay': 0,
                                'loop': 1,
                                'playlist': videoId 
                            },
                            events: {
                                'onReady': onPlayerReady 
                            }
                        });
                    } else {
                        player.loadVideoById(videoId); 
                    }
                    document.querySelector('.music-control').style.display = 'block'; 
                } else {
                    if (player) {
                        player.stopVideo(); 
                    }
                    document.querySelector('.music-control').style.display = 'none'; 
                }

                document.getElementById('tebex-button').style.display = activerTebex ? 'block' : 'none';
                document.getElementById('site-button').style.display = activerWebsite ? 'block' : 'none';
                document.getElementById('discord-button').style.display = activerDiscord ? 'block' : 'none';
                document.getElementById('armes-box').style.display = config.BoutonArmes ? 'block' : 'none';
                document.querySelector('.inner-box2').style.display = config.BoutonLootBox ? 'block' : 'none';
                document.querySelector('.inner-box3').style.display = config.BoutonHistorique ? 'block' : 'none';
                document.querySelector('.inner-box4').style.display = config.BoutonVoiture ? 'block' : 'none';

                container.style.visibility = 'visible';
                idBoutique.style.visibility = 'visible';
                ptsBoutique.style.visibility = 'visible';
                musicControl.style.visibility = 'visible';

                setTimeout(() => {
                    if (player && typeof player.playVideo === 'function') {
                        player.playVideo();
                        icon.classList.remove('fa-play');
                        icon.classList.add('fa-pause');
                    }
                }, 1000); 
            } else if (data.action === 'close') {
                if (player && typeof player.pauseVideo === 'function') {
                    player.pauseVideo();
                }
                icon.classList.remove('fa-pause');
                icon.classList.add('fa-play');

                container.style.visibility = 'hidden';
                idBoutique.style.visibility = 'hidden';
                ptsBoutique.style.visibility = 'hidden';
                musicControl.style.visibility = 'hidden';
            }
        });

        window.addEventListener('message', function(event) {
            if (event.data.action === 'openHistorique') {
                const historique = event.data.historique;
                const modal = document.getElementById('historique-modal');
                const modalContent = document.querySelector('.historique-modal-content');

                modalContent.innerHTML = '';

                const closeButton = document.createElement('span');
                closeButton.id = 'close-historique-modal';
                closeButton.classList.add('close-button');
                closeButton.innerHTML = '&times;';
                modalContent.appendChild(closeButton);

                closeButton.addEventListener('click', () => {
                    modal.style.display = 'none';  
                });

                historique.sort((a, b) => new Date(b.Date) - new Date(a.Date));

                const table = document.createElement('table');
                table.classList.add('historique-table');

                const thead = document.createElement('thead');
                thead.innerHTML = `
                    <tr>
                        <th>Type</th>
                        <th>Montant</th>
                        <th>Date</th>
                        <th>Achat</th>
                        <th>Solde Restant Après Achat</th>
                    </tr>
                `;
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                historique.forEach((entry) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${entry.Type}</td>
                        <td>${entry.Montant}</td>
                        <td>${entry.Date}</td>
                        <td>${entry.Achat}</td>
                        <td>${entry.SoldeAfterAchat}</td>
                    `;
                    tbody.appendChild(row);
                });
                table.appendChild(tbody);

                modalContent.appendChild(table);

                modal.style.display = 'flex';
            }
        });

        const lootboxBox = document.querySelector('.inner-box2');
        const closeLootboxModal = document.getElementById('close-lootbox-modal');

        lootboxBox.addEventListener('click', () => {
            toggleModal(lootboxModal, 'show');
        });

        closeLootboxModal.addEventListener('click', () => {
            toggleModal(lootboxModal, 'hide');
        });

        let currentLootboxItems = null;

        window.addEventListener('message', function (event) {
            if (event.data.action === 'open' && event.data.config.BoutonLootBox) {
                const lootBoxes = event.data.config.lootBoxes;

                if (lootBoxes && lootBoxes.length > 0) {
                    const modalContentLootBox = document.querySelector('.lootbox-modal-content');

                    modalContentLootBox.innerHTML = '';

                    const closeButton = document.createElement('span');
                    closeButton.id = 'close-lootbox-modal';
                    closeButton.classList.add('close-button');
                    closeButton.innerHTML = '&times;';
                    modalContentLootBox.appendChild(closeButton);

                    closeButton.addEventListener('click', () => {
                        toggleModal(lootboxModal, 'hide');
                    });

                    lootBoxes.forEach((lootBox) => {
                        const lootBoxContainer = document.createElement('div');
                        lootBoxContainer.classList.add('lootbox-container');

                        const lootBoxTitle = document.createElement('h3');
                        lootBoxTitle.classList.add('lootbox-title');
                        lootBoxTitle.textContent = lootBox.label;
                        lootBoxContainer.appendChild(lootBoxTitle);

                        const lootBoxImageContainer = document.createElement('div');
                        lootBoxImageContainer.classList.add('lootbox-image-container');

                        const lootBoxImage = document.createElement('img');
                        lootBoxImage.src = `./images/${lootBox.image}.png`;
                        lootBoxImage.alt = lootBox.label;
                        lootBoxImage.classList.add('lootbox-image');

                        lootBoxImageContainer.appendChild(lootBoxImage);
                        lootBoxContainer.appendChild(lootBoxImageContainer);

                        const lootBoxDescription = document.createElement('div');
                        lootBoxDescription.classList.add('lootbox-description');

                        lootBox.contents.forEach((item) => {
                            const itemElement = document.createElement('p');
                            itemElement.textContent = item.label; 
                            lootBoxDescription.appendChild(itemElement);
                        });


                        lootBoxImageContainer.appendChild(lootBoxDescription);

                        const lootBoxPrice = document.createElement('div');
                        lootBoxPrice.classList.add('lootbox-price');
                        lootBoxPrice.textContent = `${lootBox.price} PTS`;
                        lootBoxContainer.appendChild(lootBoxPrice);

                        const buyButton = document.createElement('button');
                        buyButton.textContent = `Acheter`;
                        buyButton.classList.add('buy-lootbox-button');
                        buyButton.dataset.id = lootBox.name;

                        buyButton.addEventListener('click', function () {
                            currentLootboxItems = lootBox.contents; 
                            proposerAchatLootBox(lootBox.name, lootBox.price, lootBox.contents);
                        });

                        lootBoxContainer.appendChild(buyButton);

                        modalContentLootBox.appendChild(lootBoxContainer);
                    });
                }
            }
        });

        function proposerAchatLootBox(lootBoxId, lootBoxPrice, lootboxItems) {
            confirmText.textContent = `Voulez-vous acheter cette loot box pour ${lootBoxPrice} PTS ?`;
            confirmBox.style.display = 'block';

            document.getElementById('confirm-yes').onclick = function () {
                confirmBox.style.display = 'none';

                fetch(`https://${GetParentResourceName()}/verifierPoints`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ lootBoxId: lootBoxId, lootBoxPrice: lootBoxPrice, lootboxItems: lootboxItems }),
                });
            };

            document.getElementById('confirm-no').onclick = function() {
                confirmBox.style.display = 'none';
            };
        }

        window.addEventListener('message', function (event) {
            if (event.data.action === 'afficherLootboxGagne') {
                const itemGagne = event.data.item;

                lancerBarreDeLootAvecItem(itemGagne);
            }
        });

        function lancerBarreDeLootAvecItem(itemGagne) {
            if (!itemGagne) {
                return; 
            }

            const lootboxBarre = document.getElementById('lootbox-barre');
            const lootboxContent = document.getElementById('lootbox-content');

            lootboxBarre.style.display = 'block'; 
            lootboxContent.innerHTML = ''; 
            lootboxContent.style.transition = 'none'; 
            lootboxContent.style.transform = 'translateX(0)';  
            lootboxContent.style.width = 'auto'; 

            let itemsList = [];

            currentLootboxItems.forEach((item) => {
                for (let j = 0; j < 20; j++) {  
                    itemsList.push(item);
                }
            });

            itemsList = shuffleArray(itemsList);

            itemsList.forEach((item) => {
                const lootboxItem = document.createElement('div');
                lootboxItem.classList.add('lootbox-item');

                const itemImage = document.createElement('img');
                itemImage.src = `./images/${item.image}.png`;
                itemImage.alt = item.Name;

                const itemLabel = document.createElement('h3');
                itemLabel.textContent = item.label;
                itemLabel.style.color = '#24cedf';  
                itemLabel.style.marginTop = '5px';
                itemLabel.style.fontSize = '0.9rem';

                lootboxItem.appendChild(itemImage);
                lootboxItem.appendChild(itemLabel);
                lootboxContent.appendChild(lootboxItem);
            });

            const itemWidth = lootboxContent.querySelector('.lootbox-item').offsetWidth;
            const totalWidth = itemWidth * itemsList.length;
            lootboxContent.style.width = `${totalWidth}px`;  

            let position = 0;
            const scrollSpeed = 15;  
            const centerOfBarre = lootboxBarre.offsetWidth / 2;

            const winningIndexes = [];
            itemsList.forEach((item, index) => {
                if (item.image === itemGagne) {
                    winningIndexes.push(index);
                }
            });

            if (winningIndexes.length === 0) {
                return;
            }

            const winningIndex = winningIndexes[Math.floor(Math.random() * winningIndexes.length)];

            lootboxContent.style.transition = 'transform 0.5s linear';

            const interval = setInterval(() => {
                position += scrollSpeed;
                if (position >= totalWidth) position = 0;

                lootboxContent.style.transform = `translateX(-${position}px)`;
            }, 20);

            setTimeout(() => {
                clearInterval(interval);  

                ajusterDefilementVersItemGagne(winningIndex, lootboxContent, lootboxBarre, itemWidth, function() {
                    afficherItemGagne();
                });
            }, 10000); 
        }


        function ajusterDefilementVersItemGagne(winningIndex, lootboxContent, lootboxBarre, itemWidth, callback) {
            const centerOffset = (lootboxBarre.offsetWidth / 2) - (itemWidth / 2);
            const finalPosition = (winningIndex * itemWidth) - centerOffset;

            lootboxContent.style.transition = 'transform 1s ease-out';
            lootboxContent.style.transform = `translateX(-${finalPosition}px)`;

            setTimeout(() => {
                if (typeof callback === 'function') {
                    callback();  
                }
            }, 1000);  
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];  
            }
            return array;
        }

        function afficherItemGagne() {

            setTimeout(() => {
                fetch(`https://${GetParentResourceName()}/itemGagneClient`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                const lootboxBarre = document.querySelector('.lootbox-barre');
                lootboxBarre.style.display = 'none';  

                toggleModal(lootboxModal, 'hide');

            }, 3000);

        }


    });


    </script>
</body>
</html>
